<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>La mia Giornata</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giornata">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#B9BDC3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: una colonna da agenda tascabile — riepilogo in alto, poi la giornata divisa per fasce orarie, pulsante + sempre a portata di pollice */
:root{
  --bg:#B9BDC3; --surface:#111214; --field:#232427; --ink:#F97316; --muted:#E8833A; --line:#34363A;
  --accent:#0E7A68; --accent-soft:#2A2B2E; --on-accent:#FFFFFF;
  --high:#C8452E; --mid:#C98A12; --low:#6B8B85;
  --f-display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; color-scheme:light;
}
input,select{color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
img{max-width:100%}
[hidden]{display:none!important}

*{box-sizing:border-box}
html,body,button,a,label,input,select,textarea{touch-action:manipulation}
html,body{background:var(--bg);color:var(--ink)}
.wrap{overflow-x:clip}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Testata */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.daynav{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;line-height:0;color:var(--ink)}
.today-btn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.today-btn[hidden]{display:none}
.datehead{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.datehead .eyebrow,.datehead h1{color:#111214}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,36px);line-height:1.05;margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}

/* Riepilogo */
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border-radius:20px;padding:16px;border:1px solid var(--line)}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)} .ring .bar{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* Prossima */
.next{display:flex;gap:12px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:20px;padding:14px 16px}
.next[hidden]{display:none}
.next .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.next .t{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.next .when{margin-left:auto;text-align:right;font-family:var(--f-mono);font-weight:600;font-size:14px;white-space:nowrap}
.next .body{min-width:0}

/* Filtri */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:#111214;border-color:var(--ink)}

/* Lista */
.group{display:flex;flex-direction:column;gap:8px}
.group h2{display:flex;align-items:baseline;gap:8px;margin:6px 2px 2px;font-family:var(--f-display);font-weight:700;font-size:17px}
.group h2 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:#E5484D}
.task.done::before{background:#3FB950}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;opacity:0;stroke:var(--on-accent)}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{opacity:1}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task.done{opacity:.75}
.task.moved{opacity:.5}
.main{min-width:0;background:none;border:0;text-align:left;padding:0}
.ttl{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px;color:var(--muted)}
.tag{padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-weight:700}
.time{font-family:var(--f-mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.time small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.task.late:not(.done) .time{color:var(--high)}
.task.now:not(.done){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--accent);font-family:var(--f-mono);font-size:12px;font-weight:600}
.nowline::after{content:"";flex:1;height:2px;background:var(--accent);border-radius:2px}

.empty{text-align:center;background:var(--surface);padding:28px 16px;border:1.5px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:32ch}
.empty .big{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink)}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--ink);color:#111214;border-color:var(--ink)}
.sheet button[type=submit].btn{background:#3FB950;color:#0B1A0F;border-color:#3FB950}
#cancel,#apCancel,#noteCancel{background:#E5484D;color:#fff;border-color:#E5484D}
.btn.danger{color:var(--high)}
.carry{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.carry[hidden]{display:none}
/* Promemoria sport */
.sport{display:flex;flex-direction:column;gap:8px}
.sport[hidden]{display:none}
.sport h2{display:flex;align-items:baseline;gap:8px;margin:0 2px;font-family:var(--f-display);font-weight:700;font-size:17px}
.sport h2 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.rem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.rem.past{opacity:.5}
.badge{min-width:62px;text-align:center;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.badge.f1{background:#D9261C} .badge.motogp{background:#5B5F66} .badge.inter{background:#1E4FB8}
.rem .rt{font-weight:700;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.rem .rd{font-size:12px;color:var(--muted)}
.upnext{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);padding:2px 4px}
.upnext b{color:var(--ink)}
.status{font-size:12px;color:var(--muted);text-align:center}

/* Pulsante + */
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--ink);color:#111214;padding:0;display:grid;place-items:center;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:20}

/* I tre pulsanti in basso: sempre nella stessa posizione */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:0 calc(max(16px,env(safe-area-inset-right,0px)) + 4px) calc(20px + env(safe-area-inset-bottom,0px)) calc(max(16px,env(safe-area-inset-left,0px)) + 4px);pointer-events:none;transform:translateZ(0)}
.dock .fab{position:static;transform:none;pointer-events:auto;flex:none}

/* Note */
.notelist{display:flex;flex-direction:column;gap:8px}
.swipe .note{position:relative;touch-action:pan-y;transition:transform .2s ease;will-change:transform}
.swipe .note.dragging{transition:none}
.nswipe{border-radius:14px}
.nswipe .del-bg{border-radius:14px}
.note{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit}
.note .nt{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.note .np{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note .nd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.notes-empty{text-align:center;padding:24px 12px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);font-size:14px}
#noteText{min-height:110px;height:calc(var(--vvh, 100vh) * .92 - 210px);font-size:16px;line-height:1.5;resize:none}
html.kb .sheet{bottom:var(--kb,0px);max-height:calc(var(--vvh, 100vh) - 8px);padding-bottom:12px;transition:transform .25s ease,bottom .15s ease}
html.kb #noteText{height:calc(var(--vvh, 100vh) - 190px)}

/* Calendario del mese */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h3{text-transform:capitalize}
.calnav{display:flex;gap:6px}
.calnav button:not(.xclose){width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);display:grid;place-items:center;padding:0;line-height:0}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .wd{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.cday{aspect-ratio:1/1.05;max-width:100%;border-radius:12px;border:1px solid transparent;background:var(--field);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;gap:4px;font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.cday.out{background:transparent;color:var(--muted);opacity:.45}
.cday.today{border-color:var(--ink)}
.cday.sel{background:var(--ink);color:#111214}
.cday .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex:none}
.legend .dot{width:8px;height:8px}
.dot.todo{background:var(--ink)} .dot.done{background:#3FB950}
.dot.f1{background:#D9261C} .dot.motogp{background:#9AA0A6} .dot.inter{background:#2F6BFF}
.cday.sel .dot.todo{background:#111214}
.cday .cnt{font-size:10px;font-weight:500;color:var(--muted);line-height:1}
.cday.sel .cnt{color:#111214}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.daypanel[hidden]{display:none}
.backup{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.shead h3{min-width:0}
.xclose{width:40px;height:40px;border-radius:50%;border:0;background:#E5484D;color:#fff;display:grid;place-items:center;padding:0;flex:none;box-shadow:0 4px 12px rgba(229,72,77,.35)}
.xclose:active{transform:scale(.94)}
.row[hidden]{display:none}
.time .end{display:block;font-size:11px;color:var(--muted);font-weight:500}
.allday{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;user-select:none}
.allday input{position:absolute;opacity:0;width:1px;height:1px}
.allday .sw{width:50px;height:30px;border-radius:999px;background:var(--field);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.allday .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8A8D93;transition:transform .2s,background .2s}
.allday input:checked + .sw{background:var(--ink);border-color:var(--ink)}
.allday input:checked + .sw::after{transform:translateX(20px);background:#111214}
.allday input:focus-visible + .sw{outline:2px solid var(--ink);outline-offset:2px}
.time .allday-t{font-size:11px;line-height:1.2;white-space:normal;text-align:right;display:block;max-width:64px}
.calnote{font-size:12px;color:var(--muted);text-align:center;min-height:16px}

.badge.appt{background:var(--ink);color:#111214}
.dot.appt{background:#F2F3F5}
.cday.sel .dot.appt{background:#111214}
.daypanel{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.daypanel h4{margin:0;font-family:var(--f-display);font-size:17px;text-transform:capitalize}
.dp-list{display:flex;flex-direction:column;gap:6px}
.dp-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--field);border-radius:12px;padding:8px 10px;font-size:14px;border:0;color:var(--ink);text-align:left;width:100%}
.dp-item .rt{font-weight:700;min-width:0;overflow-wrap:anywhere}
.dp-empty{font-size:13px;color:var(--muted)}
.dp-actions{display:flex;gap:8px;flex-wrap:wrap}
.dp-actions .btn{flex:1;min-width:0}
.appts{display:flex;flex-direction:column;gap:8px}
.appts[hidden]{display:none}
.appts h2{display:flex;align-items:baseline;gap:8px;margin:0 2px;font-family:var(--f-display);font-weight:700;font-size:17px}
.appts h2 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
button.rem{width:100%;text-align:left;font:inherit;color:inherit;border-style:solid;border-color:var(--ink)}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;resize:vertical;min-height:46px}

/* Foto delle attività */
.photos{display:flex;flex-direction:column;gap:8px}
.photos[hidden]{display:none}
.plabel{font-size:13px;font-weight:700;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--field);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .open{position:absolute;inset:0;border:0;background:transparent;padding:0}
.thumb .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;display:grid;place-items:center;padding:0}
.thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-weight:700;font-size:12px;border-style:dashed;cursor:pointer}
.thumb.busy{display:grid;place-items:center;color:var(--muted);font-size:12px}
.pnote{font-size:12px;color:var(--muted);min-height:0}
.pnote:empty{display:none}
.meta .pc{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:700}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.vclose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)));width:44px;height:44px;border-radius:14px;border:0;background:var(--ink);color:#111214;display:grid;place-items:center}

/* Foglio di modifica */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s ease;max-height:92%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet.dragging{transition:none}
.sheet.open{transform:none}
.sheet form,.sheet>div{width:100%;max-width:560px;margin:0 auto;min-width:0;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h3{margin:0;font-family:var(--f-display);font-size:22px}
label.f[hidden]{display:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=time],input[type=date],select{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 12px;width:100%;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:100%}
.row>*{min-width:0}
label.f,.f{min-width:0;width:100%}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;line-height:44px;max-width:100%}
input::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=time]::-webkit-calendar-picker-indicator,input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.actions .right{display:flex;gap:10px;margin-left:auto}
.confirm{display:flex;gap:8px;align-items:center;font-size:14px}
.confirm[hidden]{display:none}

/* Scorri a sinistra per eliminare */
.swipe{position:relative;border-radius:var(--r);overflow:hidden}
.swipe .del-bg{position:absolute;inset:0;background:#D92D20;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:#fff;font-weight:700;font-size:14px;gap:6px;border-radius:var(--r);visibility:hidden}
.swipe.on .del-bg{visibility:visible}
.swipe .task{touch-action:pan-y;transition:transform .2s ease;will-change:transform}
.swipe .task.dragging{transition:none}
.swipe.gone{transition:height .22s ease,opacity .22s ease;opacity:0}
.undo{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px 8px 8px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:41;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.undo[hidden]{display:none}
.undo button{height:34px;padding:0 14px;border-radius:10px;border:0;background:var(--ink);color:#111214;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#111214;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(() => {
  const $ = s => document.getElementById(s);
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
  const toMin = t => t ? (+t.slice(0,2))*60 + (+t.slice(3,5)) : null;
  const fmtDur = m => m >= 60 ? (m % 60 ? `${Math.floor(m/60)}h${pad(m%60)}` : `${m/60}h`) : `${m}m`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  const state = { day: keyOf(new Date()), tasks: [], appts: [], filter: "tutte", editing: null, prio: "media" };
  let sportEvents = [], assetsNs = null;
  const photoUrl = {};
  const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
  const srcOf = id => photoUrl[id] || BLANK;
  let store = null, unsub = null, writeChain = Promise.resolve(), loadTimer = null;

  /* ---------- Archiviazione sul dispositivo ---------- */
  const local = {
    get(k){ try { return JSON.parse(localStorage.getItem("giornata:"+k) || "null"); } catch { return null; } },
    set(k, v){ try { localStorage.setItem("giornata:"+k, JSON.stringify(v)); } catch { toast("Memoria piena: elimina qualche attività vecchia"); } }
  };

  /* Foto: salvate nel database del browser (IndexedDB) */
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open("giornata-foto", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("foto");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
      const t = db.transaction("foto", mode); const req = fn(t.objectStore("foto"));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }); };
    return { put: (id, b) => run("readwrite", st => st.put(b, id)), get: id => run("readonly", st => st.get(id)) };
  })();
  const photoLoads = {};
  function loadPhoto(id){
    if (photoUrl[id]) return Promise.resolve(photoUrl[id]);
    return photoLoads[id] || (photoLoads[id] = idb.get(id).then(b => {
      if (!b) return null;
      photoUrl[id] = URL.createObjectURL(b);
      document.querySelectorAll("img[data-pid]").forEach(i => { if (i.dataset.pid === id) { i.src = photoUrl[id]; i.style.opacity = 1; } });
      return photoUrl[id];
    }).catch(() => null));
  }
  if ("indexedDB" in window) assetsNs = {
    async upload(blob){
      const id = uid() + uid();
      await idb.put(id, blob);
      photoUrl[id] = URL.createObjectURL(blob);
      return { id, url: photoUrl[id] };
    }
  };

  async function loadSport(){
    const c = local.get("sport");
    if (Array.isArray(c?.events)) { sportEvents = c.events; renderSport(); }
    try {
      const r = await fetch("sport.json", { cache: "no-cache" });
      if (r.ok) { const d = await r.json(); if (Array.isArray(d.events)) { sportEvents = d.events; local.set("sport", d); renderSport(); } }
    } catch {}
  }

  async function initStore(){
    try { navigator.storage?.persist?.(); } catch {}
    loadSport();
    subscribe();
  }

  function subscribe(){
    if (unsub) { unsub(); unsub = null; }
    clearTimeout(loadTimer);
    const day = state.day;
    if (!store) {
      state.tasks = (local.get(day)?.tasks) || []; state.appts = (local.get(day)?.appts) || [];
      setStatus("Salvato su questo dispositivo · funziona anche offline");
      render(); autoCarry(); return;
    }
    setStatus("Caricamento…");
    loadTimer = setTimeout(() => setStatus("Connessione lenta: i dati potrebbero non essere aggiornati"), 10000);
    unsub = store.col.doc(day).onSnapshot(snap => {
      if (day !== state.day) return;
      if (!snap.metadata.fromCache) { clearTimeout(loadTimer); setStatus("Sincronizzato con il tuo account"); }
      const d = snap.exists ? snap.data() : null;
      state.tasks = d && Array.isArray(d.tasks) ? d.tasks.map(t => ({...t})) : [];
      state.appts = d && Array.isArray(d.appts) ? d.appts.map(a => ({...a})) : [];
      render(); if (!snap.metadata.fromCache) autoCarry();
    }, () => { clearTimeout(loadTimer); store = null; setStatus("Salvato su questo dispositivo"); subscribe(); });
  }

  function save(){
    const day = state.day, body = { tasks: state.tasks.map(t => ({...t})), appts: state.appts.map(a => ({...a})), updatedAt: new Date().toISOString() };
    local.set(day, body);
    render();
    if (!store) return;
    writeChain = writeChain.then(() => store.col.doc(day).set(body)).catch(e => {
      toast(e?.code === "quota_exceeded" ? "Spazio esaurito: elimina vecchie attività" : "Non salvato sull'account, riprova");
    });
  }

  async function getDay(k){
    if (!store) return local.get(k);
    try { const s = await store.col.doc(k).get(); return s.exists ? s.data() : null; } catch { return null; }
  }

  /* ---------- Rimando automatico: le attività non fatte passano a oggi, in priorità alta ---------- */
  let carrying = false;
  async function setDay(k, body){
    local.set(k, body);
    if (!store) return;
    writeChain = writeChain.then(() => store.col.doc(k).set(body)).catch(() => {});
    await writeChain;
  }
  async function autoCarry(){
    const today = keyOf(new Date());
    if (carrying || state.day !== today) return;
    carrying = true;
    try {
      let moved = 0;
      for (let i = 7; i >= 1; i--) {
        const k = addDays(today, -i);
        const d = await getDay(k);
        if (state.day !== today) return;
        const tasks = Array.isArray(d?.tasks) ? d.tasks.map(t => ({...t})) : [];
        const open = tasks.filter(t => !t.done && !t.movedTo);
        if (!open.length) continue;
        open.forEach(t => {
          if (!state.tasks.some(x => x.from === t.id))
            state.tasks.push({ ...t, id: uid(), from: t.id, origDay: t.origDay || k, prio: "alta", done: false, movedTo: undefined });
          t.movedTo = today;
        });
        moved += open.length;
        await setDay(k, { tasks: tasks, appts: Array.isArray(d?.appts) ? d.appts : [], updatedAt: new Date().toISOString() });
      }
      if (moved) {
        state.tasks = state.tasks.map(t => { const c = {...t}; delete c.movedTo; return c; });
        save();
        toast(moved === 1 ? "1 attività non fatta spostata a oggi" : `${moved} attività non fatte spostate a oggi`);
      }
    } finally { carrying = false; }
  }

  /* ---------- Rendering ---------- */
  const FILTERS = [["tutte","Tutte"],["dafare","Da fare"],["fatte","Fatte"],["alta","Urgenti"]];
  function renderChips(){
    $("chips").innerHTML = FILTERS.map(([v,l]) => `<button class="chip" data-f="${v}" aria-pressed="${state.filter===v}">${l}</button>`).join("");
  }
  $("chips").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; state.filter = b.dataset.f; render(); };

  const SLOTS = [["Mattina","06–12",0,720],["Pomeriggio","12–18",720,1080],["Sera","18–24",1080,1440]];

  function render(){
    renderChips(); renderSport(); renderAppts();
    const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
    const isToday = state.day === keyOf(now);
    const d = fromKey(state.day);
    $("weekday").textContent = isToday ? "Oggi · " + d.toLocaleDateString("it-IT",{weekday:"long"}) :
      d.toLocaleDateString("it-IT",{weekday:"long"});
    $("dateTitle").textContent = d.toLocaleDateString("it-IT",{day:"numeric",month:"long"});
    $("goToday").hidden = isToday;

    const all = state.tasks, done = all.filter(t => t.done).length;
    const pct = all.length ? Math.round(done/all.length*100) : 0;
    $("pct").textContent = pct + "%";
    $("ringBar").style.strokeDashoffset = 263.9 * (1 - pct/100);
    $("sDone").textContent = `${done}/${all.length}`;
    $("sLeft").textContent = all.filter(t => !t.done).length;
    $("sHigh").textContent = all.filter(t => !t.done && t.prio === "alta").length;

    // Prossima attività
    const nc = $("nextCard");
    const pending = all.filter(t => !t.done && t.time).sort((a,b) => toMin(a.time)-toMin(b.time));
    const cur = null;
    const nxt = isToday && pending.find(t => toMin(t.time) > nowMin);
    const pick = cur || nxt;
    if (pick) {
      nc.hidden = false;
      $("nextLbl").textContent = cur ? "In corso adesso" : "Prossima";
      $("nextTitle").textContent = pick.title;
      const diff = toMin(pick.time) - nowMin;
      $("nextWhen").innerHTML = cur ? "" :
        `${pick.time}<br>${diff < 60 ? "tra " + diff + " min" : "tra " + fmtDur(diff)}`;

      } else {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i); const m = /^giornata:(\d{4}-\d{2}-\d{2})$/.exec(k || "");
          if (m) out[m[1]] = local.get(m[1]);
        }
      }
    } catch {}
    out[state.day] = { tasks: state.tasks, appts: state.appts };
    calData = out;
  }
  function renderCal(){
    const [y, m] = calMonth;
    const first = new Date(y, m, 1);
    $("calTitle").textContent = first.toLocaleDateString("it-IT", { month: "long", year: "numeric" });
    const start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
    const today = keyOf(new Date());
    let html = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map(d => `<div class="wd">${d}</div>`).join("");
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = keyOf(d), out = d.getMonth() !== m;
      if (i >= 35 && out && d.getDate() < 8 && i % 7 === 0) break;
      const tasks = (calData[k]?.tasks || []).filter(t => !t.movedTo);
      const open = tasks.filter(t => !t.done).length;
      const sp = [...new Set(sportEvents.filter(e => e.date === k).map(e => e.sport))];
      const nAp = (calData[k]?.appts || []).length;
      let dots = "";
      if (nAp) dots += `<i class="dot appt"></i>`;
      if (tasks.length) dots += `<i class="dot ${open ? "todo" : "done"}"></i>`;
      sp.forEach(x => dots += `<i class="dot ${esc(x)}"></i>`);
      const cls = ["cday", out && "out", k === today && "today", k === calSel && "sel"].filter(Boolean).join(" ");
      const label = d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}) + (tasks.length ? `, ${open} da fare su ${tasks.length}` : "") + (nAp ? `, ${nAp} appuntamenti` : "") + (sp.length ? ", eventi sport" : "");
      html += `<button type="button" class="${cls}" data-k="${k}" aria-label="${esc(label)}"><span>${d.getDate()}</span><span class="dots">${dots}</span>${open ? `<span class="cnt">${open}</span>` : ""}</button>`;
    }
    $("calGrid").innerHTML = html;
  }
  async function openCal(){
    const d = fromKey(state.day); calMonth = [d.getFullYear(), d.getMonth()]; calSel = state.day;
    $("calNote").textContent = "Caricamento…";
    renderCal();
    $("scrim").classList.add("open"); $("calSheet").classList.add("open");
    renderDayPanel();
    await loadCalData(); $("calNote").textContent = "Tocca un giorno per vederlo o aggiungere un appuntamento"; renderCal(); renderDayPanel();
  }
  function closeCal(){ $("calSheet").classList.remove("open"); $("scrim").classList.remove("open"); }

  /* ---------- Note ---------- */
  let notes = [], notesLoaded = false, noteEditId = null;
  async function loadNotes(){
    let items = local.get("notes")?.items;
    if (store) { try { const sn = await store.col.doc("notes").get(); if (sn.exists && Array.isArray(sn.data().items)) items = sn.data().items; } catch {} }
    notes = Array.isArray(items) ? items : []; notesLoaded = true;
  }
  function saveNotes(){
    const body = { items: notes, updatedAt: new Date().toISOString() };
    local.set("notes", body);
    if (store) writeChain = writeChain.then(() => store.col.doc("notes").set(body)).catch(() => toast("Nota non salvata sull'account, riprova"));
  }
  const noteParts = t => { const lines = t.trim().split(/\n/); const title = lines.shift().trim() || "Nota senza titolo"; return { title, rest: lines.join(" ").trim() }; };
  function renderNotes(){
    const list = notes.slice().sort((a,b) => (b.updatedAt||"").localeCompare(a.updatedAt||""));
    $("noteList").innerHTML = list.length ? list.map(n => {
      const { title, rest } = noteParts(n.text || "");
      const d = new Date(n.updatedAt || Date.now());
      const when = keyOf(d) === keyOf(new Date()) ? "oggi " + d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}) : d.toLocaleDateString("it-IT",{day:"numeric",month:"short",year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"});
      return `<div class="swipe nswipe" data-id="${esc(n.id)}"><div class="del-bg" aria-hidden="true">Elimina</div><button type="button" class="note" data-note="${esc(n.id)}"><span class="nt">${esc(title)}</span>${rest ? `<span class="np">${esc(rest)}</span>` : ""}<span class="nd">${esc(when)}</span></button></div>`;
    }).join("") : `<div class="notes-empty">Nessuna nota. Tocca "+ Nuova nota" per scriverne una.</div>`;
  }
  async function openNotes(){
    if (!notesLoaded) $("noteList").innerHTML = `<div class="notes-empty">Caricamento…</div>`;
    $("scrim").classList.add("open"); $("notesSheet").classList.add("open");
    await loadNotes(); renderNotes();
  }
  function closeNotes(){ $("notesSheet").classList.remove("open"); if (!$("noteSheet").classList.contains("open")) $("scrim").classList.remove("open"); }
  function openNote(n){
    noteEditId = n ? n.id : null;
    $("noteTitle").textContent = n ? "Nota" : "Nuova nota";
    $("noteText").value = n ? (n.text || "") : "";
    $("noteDel").hidden = !n; $("noteConfirm").hidden = true;
    $("scrim").classList.add("open"); $("noteSheet").classList.add("open");
    if (!n) setTimeout(() => $("noteText").focus(), 260);
  }
  function closeNote(){ $("noteSheet").classList.remove("open"); noteEditId = null; document.activeElement?.blur?.(); if (!$("notesSheet").classList.contains("open")) $("scrim").classList.remove("open"); }
  $("notesFab").onclick = openNotes;
  $("notesX").onclick = closeNotes;
  $("noteNew").onclick = () => openNote(null);
  /* scorri una nota verso sinistra per eliminarla */
  let nsw = null, nSuppress = false;
  const NL = $("noteList");
  NL.addEventListener("pointerdown", e => {
    const card = e.target.closest(".nswipe .note"); if (!card || (e.pointerType === "mouse" && e.button !== 0)) return;
    nsw = { card, wrap: card.parentElement, x: e.clientX, y: e.clientY, dx: 0, active: false, id: e.pointerId };
  });
  NL.addEventListener("pointermove", e => {
    if (!nsw || e.pointerId !== nsw.id) return;
    const dx = e.clientX - nsw.x, dy = e.clientY - nsw.y;
    if (!nsw.active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { nsw = null; return; }
      if (dx < -10 && Math.abs(dx) > Math.abs(dy)) { nsw.active = true; nsw.wrap.classList.add("on"); nsw.card.classList.add("dragging"); try { nsw.card.setPointerCapture(e.pointerId); } catch {} }
      else return;
    }
    nsw.dx = Math.min(0, dx);
    nsw.card.style.transform = `translateX(${nsw.dx}px)`;
  });
  NL.addEventListener("pointerup", e => {
    if (!nsw || e.pointerId !== nsw.id) return;
    const g = nsw; nsw = null; if (!g.active) return;
    nSuppress = true; setTimeout(() => nSuppress = false, 60);
    g.card.classList.remove("dragging");
    const w = g.card.offsetWidth;
    if (g.dx < -Math.min(120, w * 0.35)) {
      g.card.style.transform = `translateX(${-w - 20}px)`;
      const h = g.wrap.offsetHeight; g.wrap.style.height = h + "px";
      requestAnimationFrame(() => { g.wrap.classList.add("gone"); g.wrap.style.height = "0px"; });
      setTimeout(() => {
        const i = notes.findIndex(n => n.id === g.wrap.dataset.id); if (i < 0) return;
        const [n] = notes.splice(i, 1); saveNotes(); renderNotes();
        showUndo("Nota eliminata", () => { notes.push(n); saveNotes(); renderNotes(); toast("Nota ripristinata"); });
      }, 230);
    } else { g.card.style.transform = ""; setTimeout(() => g.wrap.classList.remove("on"), 220); }
  });
  NL.addEventListener("pointercancel", () => { if (nsw && nsw.active) { nsw.card.classList.remove("dragging"); nsw.card.style.transform = ""; } nsw = null; });

  $("noteList").onclick = e => { if (nSuppress) { e.preventDefault(); return; } const b = e.target.closest("[data-note]"); if (!b) return; const n = notes.find(x => x.id === b.dataset.note); if (n) openNote(n); };
  $("noteX").onclick = closeNote; $("noteCancel").onclick = closeNote;
  $("noteForm").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("noteText").value.replace(/\s+$/, "");
    if (!text.trim()) { if (noteEditId) { notes = notes.filter(n => n.id !== noteEditId); saveNotes(); renderNotes(); } closeNote(); return; }
    const now = new Date().toISOString();
    if (noteEditId) { const n = notes.find(x => x.id === noteEditId); if (n) { n.text = text; n.updatedAt = now; } }
    else notes.push({ id: uid(), text, createdAt: now, updatedAt: now });
    const isNew = !noteEditId;
    saveNotes(); renderNotes(); closeNote(); toast(isNew ? "Nota salvata" : "Nota aggiornata");
  });
  $("noteDel").onclick = () => { $("noteDel").hidden = true; $("noteConfirm").hidden = false; };
  $("noteDelNo").onclick = () => { $("noteDel").hidden = false; $("noteConfirm").hidden = true; };
  $("noteDelYes").onclick = () => { const id = noteEditId; notes = notes.filter(n => n.id !== id); saveNotes(); renderNotes(); closeNote(); toast("Nota eliminata"); };

  /* ---------- Tastiera aperta: i pannelli restano sopra la tastiera ---------- */
  (() => {
    const vv = window.visualViewport; if (!vv) return;
    const root = document.documentElement;
    const fit = () => {
      const kb = Math.max(0, Math.round(window.innerHeight - (vv.offsetTop + vv.height)));
      root.style.setProperty("--vvh", Math.round(vv.height) + "px");
      root.style.setProperty("--kb", kb + "px");
      root.classList.toggle("kb", kb > 80);
    };
    vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit();
  })();
  $("noteText").addEventListener("focus", () => setTimeout(() => { window.scrollTo(0, window.scrollY); }, 50));

  /* ---------- Trascina verso il basso per chiudere i pannelli ---------- */
  [["sheet", () => closeSheet()], ["calSheet", () => closeCal()], ["apSheet", () => closeAppt()], ["notesSheet", () => closeNotes()], ["noteSheet", () => closeNote()]].forEach(([id, close]) => {
    const el = $(id); let d = null;
    el.addEventListener("touchstart", e => {
      const top = e.touches[0].clientY - el.getBoundingClientRect().top < 72;   // la parte alta del pannello trascina sempre
      if (e.touches.length !== 1 || !el.classList.contains("open") || (el.scrollTop > 0 && !top)) { d = null; return; }
      d = { y: e.touches[0].clientY, x: e.touches[0].clientX, t: Date.now(), dy: 0, on: false, top };
    }, { passive: true });
    el.addEventListener("touchmove", e => {
      if (!d) return;
      const dy = e.touches[0].clientY - d.y, dx = e.touches[0].clientX - d.x;
      if (!d.on) {
        if (dy > 8 && dy > Math.abs(dx) && (el.scrollTop <= 0 || d.top)) { d.on = true; el.classList.add("dragging"); document.activeElement?.blur?.(); }
        else if (dy < -4 || Math.abs(dx) > 10) { d = null; return; }
        else return;
      }
      e.preventDefault();
      d.dy = Math.max(0, dy);
      el.style.transform = `translateY(${d.dy}px)`;
    }, { passive: false });
    const end = () => {
      if (!d) return; const g = d; d = null;
      if (!g.on) return;
      el.classList.remove("dragging");
      const fast = g.dy / Math.max(1, Date.now() - g.t) > 0.6;
      if (g.dy > Math.min(140, el.offsetHeight * 0.25) || (fast && g.dy > 40)) {
        el.style.transform = "translateY(105%)";
        close();
        setTimeout(() => { el.style.transform = ""; }, 280);
      } else el.style.transform = "";
    };
    el.addEventListener("touchend", end);
    el.addEventListener("touchcancel", end);
  });
  $("calFab").onclick = openCal;
  $("calX").onclick = closeCal;
  $("calPrev").onclick = () => { calMonth = calMonth[1] === 0 ? [calMonth[0]-1, 11] : [calMonth[0], calMonth[1]-1]; renderCal(); };
  $("calNext").onclick = () => { calMonth = calMonth[1] === 11 ? [calMonth[0]+1, 0] : [calMonth[0], calMonth[1]+1]; renderCal(); };
  $("calGrid").onclick = e => { const b = e.target.closest(".cday"); if (!b) return; calSel = b.dataset.k; renderCal(); renderDayPanel(); };
  function renderDayPanel(){
    const k = calSel; if (!k) { $("dayPanel").hidden = true; return; }
    $("dayPanel").hidden = false;
    $("dpTitle").textContent = fromKey(k).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
    const appts = (calData[k]?.appts || []).slice().sort((a,b) => apSortKey(a).localeCompare(apSortKey(b)));
    const tasks = (calData[k]?.tasks || []).filter(t => !t.movedTo);
    const open = tasks.filter(t => !t.done).length;
    const sp = sportEvents.filter(e => e.date === k).sort((a,b) => (a.time||"").localeCompare(b.time||""));
    let html = appts.map(a => `<button type="button" class="dp-item" data-appt="${a.id}"><span class="badge appt">Appunt.</span><span class="rt">${esc(a.title)}${a.place ? `<span class="rd" style="display:block;font-weight:400">${esc(a.place)}</span>` : ""}</span><span class="time">${apTimeHTML(a)}</span></button>`).join("");
    if (tasks.length) html += `<div class="dp-item"><span class="badge appt" style="background:transparent;color:var(--ink);border:1px solid var(--ink)">Attività</span><span class="rt">${open ? `${open} da fare su ${tasks.length}` : `Tutte fatte (${tasks.length})`}</span><span></span></div>`;
    html += sp.map(e => `<div class="dp-item"><span class="badge ${esc(e.sport)}">${SPORT_LBL[e.sport] || esc(e.sport)}</span><span class="rt">${esc(e.title)}</span><span class="time">${esc(e.time||"")}</span></div>`).join("");
    $("dpList").innerHTML = html || `<div class="dp-empty">Niente in programma.</div>`;
  }
  $("dpList").onclick = e => { const b = e.target.closest("[data-appt]"); if (!b) return; const a = (calData[calSel]?.appts || []).find(x => x.id === b.dataset.appt); if (a) openAppt(calSel, a); };
  $("dpAdd").onclick = () => openAppt(calSel || state.day, null);
  $("dpOpen").onclick = () => { const k = calSel; closeCal(); if (k) go(k); };
  $("prev").onclick = () => go(addDays(state.day, -1));
  $("next").onclick = () => go(addDays(state.day, 1));
  $("goToday").onclick = () => go(keyOf(new Date()));

  let tt; function toast(m){ const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800); }
  function setStatus(m){ $("status").textContent = m; }

  /* ---------- Backup: salva e ripristina ---------- */
  const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
  $("bkExport").onclick = async () => {
    $("bkNote").textContent = "Preparo il backup…";
    try {
      const days = {}, ids = new Set();
      for (let i = 0; i < localStorage.length; i++) {
        const m = /^giornata:(\d{4}-\d{2}-\d{2})$/.exec(localStorage.key(i) || "");
        if (!m) continue;
        const d = local.get(m[1]); if (!d) continue;
        days[m[1]] = d; (d.tasks || []).forEach(t => (t.photos || []).forEach(id => ids.add(id)));
      }
      const photos = {};
      for (const id of ids) { try { const b = await idb.get(id); if (b) photos[id] = await blobToDataURL(b); } catch {} }
      const data = { app: "La mia Giornata", version: 1, createdAt: new Date().toISOString(), days, photos, notes: local.get("notes") };
      const name = `giornata-backup-${keyOf(new Date())}.json`;
      const file = new File([JSON.stringify(data)], name, { type: "application/json" });
      if (navigator.canShare?.({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "Backup Giornata" }); $("bkNote").textContent = "Backup pronto: salvalo in File o in iCloud Drive."; return; }
        catch (e) { if (e?.name === "AbortError") { $("bkNote").textContent = ""; return; } }
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      $("bkNote").textContent = "Backup scaricato.";
    } catch { $("bkNote").textContent = "Non sono riuscito a creare il backup."; }
  };
  $("bkFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || typeof data.days !== "object") throw 0;
      let n = 0;
      for (const [k, v] of Object.entries(data.days)) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && v) { local.set(k, v); n++; }
      for (const [id, url] of Object.entries(data.photos || {})) { try { const b = await (await fetch(url)).blob(); await idb.put(id, b); } catch {} }
      if (data.notes && Array.isArray(data.notes.items)) { local.set("notes", data.notes); notesLoaded = false; }
      $("bkNote").textContent = `Ripristinati ${n} giorni.`;
      subscribe(); await loadCalData(); renderCal(); renderDayPanel();
    } catch { $("bkNote").textContent = "Questo file non è un backup di Giornata."; }
  });

  // Aggiorna "ora" ogni minuto, e torna a oggi se la pagina resta aperta dopo mezzanotte
  let lastToday = keyOf(new Date());
  setInterval(() => { const k = keyOf(new Date()); if (k !== lastToday) { if (state.day === lastToday) go(k); lastToday = k; } else render(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  try { navigator.wakeLock; } catch {}

  render();
  initStore();
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
